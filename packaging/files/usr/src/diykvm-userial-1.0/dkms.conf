PACKAGE_NAME="diykvm-userial"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"
# Replacement u_serial for the gadget serial (CDC-ACM). Two patches: (1) a tunable RX/TX request queue depth
# (default 256 packets) so a bursty bulk-OUT doesn't NAK-stall; (2) re-enumeration self-heal -- keep an open
# ttyGS port across a transient gadget re-enumerate (survive_reenum) plus a periodic OUT-endpoint re-arm
# watchdog (rearm_ms), so the serial OUT endpoint doesn't "die out" after a re-enumeration and recover only
# on a close+reopen. The Makefile's `all` target fetches + patches the u_serial source matching the target
# kernel (into the build dir), then builds it. Installs into updates/dkms (preferred by depmod over the
# in-tree module); `dkms remove` restores the stock module.
BUILT_MODULE_NAME[0]="u_serial"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean KVER=${kernelver}"
