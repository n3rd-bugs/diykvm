# DIY KVM configuration.
# After editing:  sudo systemctl restart kvm-web ustreamer kvm-gadget

[web]
# Web UI / API bind address and port.
host = 0.0.0.0
port = 8000
# Serve HTTPS (and wss:// for input) — set tls = true and provide a cert + key.
tls = false
tls_cert = /etc/kvm/tls/cert.pem
tls_key  = /etc/kvm/tls/key.pem
# Extra browser origins allowed to connect (comma-separated host[:port]); normally blank.
allowed_origins =

[video]
# USB HDMI capture device and stream settings.
device = /dev/video0
resolution = 1920x1080
fps = 30
ustreamer_host = 127.0.0.1
ustreamer_port = 8080

[usb]
# Virtual USB drive (GPT + FAT32 EFI System Partition) presented to the target.
image_path = /opt/kvm/images/drive.img
image_size = 1G

[serial]
# Default baud for the serial console (the operator can change it in the UI).
default_baud = 115200
