# DIY KVM configuration.
# After editing:  sudo systemctl restart kvm-web ustreamer kvm-gadget

[web]
# Web UI / API bind address and port.
host = 0.0.0.0
port = 8000
# Serve HTTPS (and wss:// for input). Default ON: browsers auto-upgrade http->https (HTTPS-First / HSTS)
# and treat http vs https as different sites for cookies (schemeful same-site), which breaks the session
# login over plain HTTP. The installer generates a self-signed cert; replace it with your own any time.
# Set tls = false only if you front this with a TLS-terminating proxy.
tls = true
tls_cert = /etc/kvm/tls/cert.pem
tls_key  = /etc/kvm/tls/key.pem
# Extra browser origins allowed to connect (comma-separated host[:port]); normally blank.
allowed_origins =

[video]
# USB HDMI capture device and stream settings.
device = /dev/video0
# Multi-PC: list one capture card per target as "Label:/dev/videoN", comma-separated, e.g.
#   devices = PC1:/dev/video0, PC2:/dev/video1
# The web UI then shows a source picker to choose which card to watch; only the selected card streams
# (switching restarts the streamer, ~1-2s). Blank = just the single `device` above. Tip: for stable
# names across reboots, use a /dev/v4l/by-id/... path as the device.
devices =
resolution = 1920x1080
fps = 30
# JPEG quality 1-100: the BASE bandwidth knob (what the capture encodes at). 1080p30 at quality 80 is
# ~20-40 Mbit/s -- far more than a remote/VPN link carries.
quality = 80
# Adaptive video (per viewer): the web UI's video channel measures each frame's send->ack time and, when
# a viewer's link is slow, automatically re-encodes their frames at lower quality/scale so latency stays
# at ~1 frame while the frame rate goes UP. A fast LAN viewer always gets the original frames untouched.
# The UI shows a small "▼q..." marker while degraded. Turn off to always send originals.
adaptive = true
ustreamer_host = 127.0.0.1
ustreamer_port = 8080

[usb]
# USB gadget functions to present to the target. Each costs endpoints on the Pi's USB controller (only 7
# total): keyboard 1, mouse 1, mouse_rel 1, mass_storage 2, usb_serial 3. Turn off what a target doesn't
# need -- fewer functions = a more robust gadget (less chance of re-enumeration/endpoint trouble).
# Changing any of these rebuilds the gadget: sudo systemctl restart kvm-gadget. At least one must stay
# enabled. If everything is on the budget would hit 8, so the relative mouse is auto-dropped (a WARN is
# logged by kvm-gadget).
# mouse = the ABSOLUTE pointer (what the UI's default Absolute mode uses); mouse_rel = a separate
# RELATIVE pointer (the UI's Relative mode, for pointer-lock/gaming/BIOSes without abs support). They are
# separate USB mice on purpose: Linux targets drop the buttons of a second pointer collection packed into
# the same interface, so relative-mode clicks only work as an own interface.
# Some hosts (or KVM-switch paths) cannot digest a THIRD HID interface and keep re-enumerating the gadget
# in a ~5 s reset loop (visible as "new address"/"End Point Request ERROR" cycles in the Pi's dmesg, and a
# keyboard/mouse that never comes up on the target). Set mouse_rel = false there: relative input is then
# emulated on the absolute mouse, so Relative mode / touch / keep-awake all keep working.
keyboard = true
mouse = true
mouse_rel = true
mass_storage = true
# Virtual USB drive (GPT + FAT32 EFI System Partition) presented to the target (needs mass_storage = true).
image_path = /opt/kvm/images/drive.img
image_size = 1G
# Also present a USB serial (CDC-ACM) COM port to the target (the Pi side is /dev/ttyGS0, usable in the
# web serial console). Changing this rebuilds the gadget (brief re-enumerate): restart kvm-gadget.
usb_serial = false
# Present a second mass-storage LUN: a scratch, read-write block device the connected host can WRITE(10) to
# and you read back via GET /api/store/region -- a generic one-way host->Pi block store (useful for bulk
# data offload: logs, captures, firmware dumps, etc). Backed by /opt/kvm/store.img. Rebuilds the gadget.
store_lun = false
# Size of the store LUN backing file (created on first use), e.g. 64M, 256M, 1G.
store_size = 64M
# Optional SCSI INQUIRY string for the store LUN so a specific host firmware can identify it (first 8
# chars = vendor, next up to 16 = product). Blank = the kernel default. Set this to your host's match string.
store_inquiry =

[serial]
# Defaults for the serial console (the operator can override per-session in the UI). Ports always open
# raw, 8N1, echo off, DTR asserted, and are drained continuously into a ring buffer (scrollback).
default_baud = 115200
# Flow control: none | rtscts (hardware RTS/CTS) | xonxoff (software XON/XOFF).
default_flow = none
# Comma-separated ports to auto-open and continuously drain from boot (a socat-style persistent reader).
# Blank (the default) leaves the gadget COM port closed until the OTHER END requests it via the API
# (POST /api/serial/open), so the target controls when the Pi attaches. List e.g. /dev/ttyGS0 here only if
# you instead want the Pi to grab the port on boot. POST /api/serial/reenumerate re-enumerates the gadget
# on request (fresh COM port to the target).
autostart =
# Once a port is open, auto-reopen it if it drops (e.g. the target re-enumerates the COM port). The port
# silently re-opens with backoff while keeping connected clients attached and the buffer intact, so the
# churn is invisible on the console. This self-heal complements POST /api/serial/reenumerate.
reconnect = true

[power]
# Control each target's power with a GPIO. The web UI shows On/Off per target. Read live, so
# Config-page changes take effect immediately. Nothing is driven on startup, so restarting never
# power-cycles a target.
enabled = false
# Control style:
#   relay  = a latched relay/switch that CONNECTS or CUTS power. 'on'/'off' hold the line at a level
#            (driven register-level with pinctrl, survives an app restart) and the real state is read back.
#   button = a MOMENTARY front-panel power button (GPIO across the motherboard's power header via a
#            relay/opto). A short press powers on; a long hold forces off (ATX soft power). There is no
#            feedback, so the state is TRACKED in software and assumed OFF at startup.
mode = relay
# Set true for active-low wiring (drive the line LOW = active: relay 'on', or button 'pressed').
active_low = false
# Open-drain output: active sinks the line to ground, inactive releases it to high-Z and never drives
# high (provide an EXTERNAL pull-up to set the level). For 5 V relay/opto inputs or shared lines.
open_drain = false
# Power-button mode only: how long (seconds) to hold the button. A brief press powers on; a long hold
# is a hard force-off. Clamped to 1..300 s. Ignored in relay mode.
hold_on_sec = 1
hold_off_sec = 30
# Comma-separated list of targets, each "Label:BCMpin" (e.g. PC1:5, PC2:6).
targets =

[kvmswitch]
# Drive an external hardware KVM switch (which toggles display + USB between two or more targets) by
# pulsing a GPIO wired to each of its front-panel select buttons. The web UI shows one button per entry.
# Read live, so changes from the Config page take effect immediately.
enabled = false
chip = gpiochip0
# Set true for active-low wiring (e.g. relay boards).
active_low = false
# Momentary press length, milliseconds.
pulse_ms = 300
# Comma-separated list of buttons, each "Label:BCMpin" (e.g. PC1:5, PC2:6, Cycle:13).
ports =

[ui]
# Keyboard shortcut that releases input capture in the web UI (returns control to your local machine).
# Format: optional Ctrl/Alt/Shift/Meta + a key (JS KeyboardEvent.code), e.g. Ctrl+Space, Ctrl+Alt+KeyK.
# Blank disables the shortcut (use the on-screen button to release).
capture_exit = Ctrl+Space
