# DIY KVM configuration.
# After editing:  sudo systemctl restart kvm-web ustreamer kvm-gadget

[web]
# Web UI / API bind address and port.
host = 0.0.0.0
port = 8000
# Serve HTTPS (and wss:// for input) — set tls = true and provide a cert + key.
tls = false
tls_cert = /etc/kvm/tls/cert.pem
tls_key  = /etc/kvm/tls/key.pem
# Extra browser origins allowed to connect (comma-separated host[:port]); normally blank.
allowed_origins =

[video]
# USB HDMI capture device and stream settings.
device = /dev/video0
resolution = 1920x1080
fps = 30
ustreamer_host = 127.0.0.1
ustreamer_port = 8080

[usb]
# Virtual USB drive (GPT + FAT32 EFI System Partition) presented to the target.
image_path = /opt/kvm/images/drive.img
image_size = 1G
# Also present a USB serial (CDC-ACM) COM port to the target (the Pi side is /dev/ttyGS0, usable in the
# web serial console). Changing this rebuilds the gadget (brief re-enumerate): restart kvm-gadget.
usb_serial = false

[serial]
# Defaults for the serial console (the operator can override per-session in the UI). Ports always open
# raw, 8N1, echo off, DTR asserted, and are drained continuously into a ring buffer (scrollback).
default_baud = 115200
# Flow control: none | rtscts (hardware RTS/CTS) | xonxoff (software XON/XOFF).
default_flow = none
# Comma-separated ports to keep open and continuously drained from boot (a socat-style persistent reader)
# so the target's output is never dropped and is buffered even before anyone connects. The gadget COM port
# /dev/ttyGS0 only exists when usb_serial is on; listing it here is harmless when it's absent. Blank = off.
autostart = /dev/ttyGS0
# Auto-reopen a port if it disconnects (e.g. the target re-enumerates the COM port over and over). The
# port silently re-opens with backoff while keeping connected clients attached and the buffer intact, so
# the churn is invisible on the console.
reconnect = true

[power]
# Control each target's power with a GPIO wired to a relay that CONNECTS or CUTS its power
# (latched on/off, not a momentary button). The web UI shows On/Off per target. The line is held
# at its level with pinctrl (so it survives an app restart). Read live, so Config-page changes
# take effect immediately. Nothing is driven on startup, so restarting never power-cycles a target.
enabled = false
# Set true for active-low relays (drive the line LOW to connect power).
active_low = false
# Open-drain output: 'on' sinks the line to ground, 'off' releases it to high-Z and never drives it
# high (provide an EXTERNAL pull-up to set the off level). For 5 V relay/opto inputs or shared lines.
open_drain = false
# Comma-separated list of targets, each "Label:BCMpin" (e.g. PC1:5, PC2:6).
targets =

[kvmswitch]
# Drive an external hardware KVM switch (which toggles display + USB between two or more targets) by
# pulsing a GPIO wired to each of its front-panel select buttons. The web UI shows one button per entry.
# Read live, so changes from the Config page take effect immediately.
enabled = false
chip = gpiochip0
# Set true for active-low wiring (e.g. relay boards).
active_low = false
# Momentary press length, milliseconds.
pulse_ms = 300
# Comma-separated list of buttons, each "Label:BCMpin" (e.g. PC1:5, PC2:6, Cycle:13).
ports =

[ui]
# Keyboard shortcut that releases input capture in the web UI (returns control to your local machine).
# Format: optional Ctrl/Alt/Shift/Meta + a key (JS KeyboardEvent.code), e.g. Ctrl+Space, Ctrl+Alt+KeyK.
# Blank disables the shortcut (use the on-screen button to release).
capture_exit = Ctrl+Space
