name: build-deb

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to attach the .deb to a GitHub release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python (syntax + undefined names)
        run: |
          python3 -m pip install --quiet pyflakes
          python3 -m py_compile app/*.py
          python3 -m pyflakes app/*.py

      - name: Shellcheck maintainer scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh packaging/DEBIAN/postinst packaging/DEBIAN/prerm packaging/DEBIAN/postrm \
                     packaging/files/usr/local/sbin/kvm-ustreamer packaging/files/usr/local/sbin/kvm-mkimage || true

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh packaging/DEBIAN/postinst packaging/DEBIAN/prerm packaging/DEBIAN/postrm
          bash packaging/build-deb.sh

      - name: Inspect package
        run: |
          dpkg-deb --info diykvm_*_all.deb
          dpkg-deb --contents diykvm_*_all.deb

      - uses: actions/upload-artifact@v4
        with:
          name: diykvm-deb
          path: diykvm_*_all.deb

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: diykvm_*_all.deb
