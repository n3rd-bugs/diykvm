<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIY PiKVM — Sign in</title>
<!-- AI agents: a machine-readable API descriptor is served at GET /api (JSON, public). Human guide: /api-guide -->
<link rel="help" type="application/json" href="/api" title="Agent API descriptor (JSON)">
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#111; color:#ddd;
              font:14px/1.5 system-ui,sans-serif; display:flex; align-items:center; justify-content:center; }
  form { background:#1b1b1b; border:1px solid #333; border-radius:10px; padding:26px 24px;
         width:300px; display:flex; flex-direction:column; gap:12px; }
  h1 { margin:0 0 6px; font-size:18px; }
  label { font-size:12px; color:#9ab; }
  input { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:10px; font-size:14px; }
  button { background:#1d4f8b; color:#fff; border:0; border-radius:6px; padding:11px; font-size:15px; cursor:pointer; }
  button:hover { background:#236bbd; }
  .err { color:#f29; font-size:12px; min-height:14px; }
  .sub { color:#666; font-size:11px; text-align:center; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>🖥️ DIY PiKVM</h1>
    <div class="err" id="err"></div>
    <label>Username</label>
    <input name="username" autocomplete="username" autofocus required>
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="sub">LAN-only · agents: GET <a href="/api" style="color:#6db3ff">/api</a> (JSON) to authenticate &amp; drive</div>
  </form>
<script>
  if (new URLSearchParams(location.search).get('e')) document.getElementById('err').textContent = 'Invalid username or password';
</script>
</body>
</html>
